name: research-cycle

on:
  schedule:
    # 08:00 UTC = 03:00 CDT — off-peak window for personal subscription quota.
    # GitHub cron is UTC-only and routinely fires 60-100 min late, so the job
    # itself owns the pacing: it loops until config.yml schedule.window_end_utc
    # (11:00 UTC = 06:00 CDT) rather than relying on a fan-out of cron slots.
    # In winter (CST, UTC-6) this lands an hour earlier: 02:00-05:00 local.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

concurrency:
  group: research-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    # 3h window + slack for a late cron firing. Public repo → Actions minutes are free.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install validator deps
        run: pip install pyyaml requests

      - name: Configure git
        run: |
          git config user.name "SPIRAL-bot"
          git config user.email "spiral-bot@users.noreply.github.com"

      - name: Run nightly research batch
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash scripts/run_night.sh

      # run_night.sh pushes after every cycle; this only catches state left behind
      # by a cycle that was cut short (job timeout, cancellation).
      - name: Push trailing state
        if: always()
        run: |
          git add -A
          git commit -m "partial cycle state" || echo "nothing to commit"
          git push || echo "push failed"
