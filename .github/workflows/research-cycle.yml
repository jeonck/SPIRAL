name: research-cycle

on:
  schedule:
    # 18:00 UTC = 03:00 KST — off-peak window for personal subscription quota
    - cron: "0 18 * * *"
  workflow_dispatch: {}

concurrency:
  group: research-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install validator deps
        run: pip install pyyaml requests

      - name: Run one research cycle
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash scripts/run_cycle.sh

      - name: Commit and push state
        run: |
          git config user.name "SPIRAL-bot"
          git config user.email "spiral-bot@users.noreply.github.com"
          git add -A
          CYCLE=$(python -c "import json;print(json.load(open('state/meta.json'))['cycle'])")
          git commit -m "cycle ${CYCLE}: $(cat state/queue/last_completed_task.txt 2>/dev/null || echo 'run')" || echo "nothing to commit"
          git push
