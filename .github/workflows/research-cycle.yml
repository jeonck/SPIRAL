name: research-cycle

on:
  schedule:
    # Fires 2.5h before the research window opens (08:00-11:00 UTC = 03:00-06:00 CDT,
    # config.yml schedule.window_{start,end}_utc). GitHub's scheduled events have run
    # 77, 100, 151 and 149 min late here — the delay has settled near 150 min, so the
    # lead time is sized to absorb that in full. Firing at 08:00 cost all but 3 of 18
    # cycles on 2026-07-28; 06:00 recovered 14 of 18 on 07-29, still losing ~29 min to
    # the residual delay. The job holds until the window opens, so an on-time firing
    # still starts at 03:00 local and the extra lead time costs nothing.
    # In winter (CST, UTC-6) the whole window lands an hour earlier: 02:00-05:00 local.
    - cron: "30 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: research-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    # Up to 2.5h holding for the window to open + the 3h window itself, plus slack for
    # a final cycle that overruns the window end. Public repo → Actions minutes are
    # free, so the hold costs nothing. (GitHub caps hosted jobs at 360 min.)
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator deps
        run: pip install pyyaml requests

      # Pinned from config.yml (single source of truth with the recorded provenance).
      # An unpinned `@latest` would let the CLI change mid-deployment, confounding the
      # accumulation measurement this repository exists to produce.
      - name: Install Claude Code CLI (pinned)
        run: |
          V=$(python -c "import yaml;print(yaml.safe_load(open('config.yml'))['runtime']['cli_version'])")
          echo "pinning @anthropic-ai/claude-code@${V}"
          npm install -g "@anthropic-ai/claude-code@${V}"

      - name: Configure git
        run: |
          git config user.name "SPIRAL-bot"
          git config user.email "spiral-bot@users.noreply.github.com"

      - name: Run nightly research batch
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash scripts/run_night.sh

      # run_night.sh pushes after every cycle; this only catches state left behind
      # by a cycle that was cut short (job timeout, cancellation).
      - name: Push trailing state
        if: always()
        run: |
          git add -A
          git commit -m "partial cycle state" || echo "nothing to commit"
          git push || echo "push failed"
