# SPIRAL configuration

# Pinned execution environment. The paper measures accumulation over N weeks, so an
# unpinned model or CLI is an uncontrolled variable in a longitudinal experiment: a
# mid-run upgrade would be indistinguishable from an accumulation effect. Both values
# are recorded into state/meta.json every cycle, so git history carries per-cycle
# provenance. Cycles 1-6 (2026-07-26..28) ran before this pin and are unattributable.
runtime:
  model: claude-opus-5
  cli_version: "2.1.220"

budget:
  # Raised 50 -> 75 on 2026-07-31. At 50, three of twelve cycles that night died on the
  # turn budget (cycles 38/40/44), burning 34 of 174 min and producing nothing: an
  # aborted cycle is rolled back and its successor restarts from scratch. Trading a
  # longer cycle for a completed one is the better side of that exchange. Watch the
  # cycles/night count — this is a throughput/depth tradeoff, not a free win.
  max_turns: 75          # claude -p --max-turns per cycle
  max_new_sources: 5     # T1: max sources added per collect cycle

schedule:
  collect_refresh_every: 7   # every Nth cycle, T5 schedules a T1 for the weakest issue
  # Nightly batch (scripts/run_night.sh). A cycle takes ~4-5 min, so one firing per
  # night wastes the idle-quota window; cycles run back-to-back instead.
  cycle_interval_min: 10     # start-to-start spacing, so quota refills between cycles
  # Cron fires early (see the workflow) to absorb GitHub's scheduling delay, which has
  # been 77/100/151 min on the runs so far. The job waits for window_start_utc if it
  # fires before it, so an on-time firing does not start research hours early.
  window_start_utc: "08:00"  # 03:00 CDT — earliest a cycle may start
  window_end_utc: "11:00"    # hard stop = 06:00 CDT (UTC-5); 05:00 CST in winter
  # Circuit breakers. Without these an unattended month can spin on one stuck task.
  max_task_attempts: 3       # retries of ONE queue entry before escaping to the next stage
  abort_after_consecutive_failures: 3   # cycles that died outright (bad token, missing CLI)
  abort_after_consecutive_invalid: 6    # cycles that ran but failed the gates — nothing is landing

gates:
  g1_check_urls: true        # validator: every new source URL must resolve (HTTP < 400)
  g1_url_timeout_sec: 15
  g2_retrospect_count: 1     # each cycle re-verifies this many random prior conclusions
  g3_contradiction_demotion: 2   # score points deducted when a contradiction flag is open

scoring:
  scale_min: 0
  scale_max: 5
  tie_break_recent_attempt_penalty: 1   # per attempt within last 5 cycles
